<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Apply the saved theme before first paint (light cream is the default) */
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('sksoft-theme') === 'dark' ? 'dark' : 'light';
      } catch (err) {
        /* localStorage unavailable — keep the light default */
      }
    </script>
    <meta name="theme-color" content="#07070b" />
    <title>Sksoft — Software Development Collective | Ideas In. Products Out.</title>
    <meta
      name="description"
      content="Sksoft is a team of skilled developers helping startups, businesses and entrepreneurs turn ideas into powerful websites, applications and software. Web • Mobile • SaaS • AI • Custom Software."
    />
    <meta name="keywords" content="software development, web development, mobile apps, SaaS, AI, custom software, Sksoft" />
    <meta property="og:title" content="Sksoft — We Build Digital Products That Move Businesses Forward" />
    <meta
      property="og:description"
      content="A team of skilled developers helping startups, businesses and entrepreneurs turn ideas into powerful websites, applications and software."
    />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
